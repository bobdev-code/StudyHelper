<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#071e35">
    <title>StudyHelper · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f1;color:#071e35;font:16px/1.55 system-ui,sans-serif;padding:24px}.card{max-width:560px;background:#fff;border:1px solid #d9d3c8;border-radius:24px;padding:36px;box-shadow:0 18px 55px #071e3512}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#071e35;color:#fff;font-size:24px;font-weight:800}h1{margin:24px 0 10px;font-size:clamp(28px,7vw,44px);line-height:1.05}p{color:#526170}button{border:0;border-radius:12px;background:#ef7d52;color:#fff;font:inherit;font-weight:750;padding:13px 18px;cursor:pointer}.en{border-top:1px solid #ebe6dc;margin-top:24px;padding-top:20px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">L</div>
      <h1>Du bist offline.</h1>
      <p>Bereits geladene Lernbereiche und dein lokaler Fortschritt bleiben verfügbar. Stelle die Verbindung wieder her und versuche es erneut.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
      <div class="en"><strong>You are offline.</strong><p>Previously loaded study areas and local progress remain available. Reconnect and try again.</p></div>
    </main>
  </body>
</html>
